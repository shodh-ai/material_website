  <circle cx="345" cy="280.70" r="5" fill="#22786c"/>
  <circle cx="564" cy="306.14" r="5" fill="#22786c"/>
  <text x="579" y="312.14" fill="#22786c" font-size="22" font-weight="700">0.24%</text>
  <polyline points="126,159.37 345,172.68 564,185.31" stroke="#b64d32" stroke-width="4" fill="none"/>
