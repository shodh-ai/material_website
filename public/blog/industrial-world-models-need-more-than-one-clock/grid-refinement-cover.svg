  <path d="M97 171.26H684" stroke="#d4dee8"/>
  <text x="86" y="177.26" text-anchor="end" font-size="17" fill="#46596a">16%</text>
  <text x="126" y="348" text-anchor="middle" font-size="19" fill="#46596a">32³</text>
  <text x="345" y="348" text-anchor="middle" font-size="19" fill="#46596a">64³</text>
  <text x="564" y="348" text-anchor="middle" font-size="19" fill="#46596a">128³</text>
  <polyline points="126,247.50 345,280.70 564,306.14" stroke="#22786c" stroke-width="4" fill="none"/>
