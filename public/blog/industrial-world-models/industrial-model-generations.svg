  <text x="118" y="266" font-size="15" font-weight="700" fill="#4e687d" text-anchor="middle">GENERATION I</text>
  <text x="118" y="302" font-size="27" font-weight="700" fill="#142638" text-anchor="middle">Generate</text>
  <text x="118" y="332" font-size="16" font-weight="400" fill="#142638" text-anchor="middle">p(data)</text>
